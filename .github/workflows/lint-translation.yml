name: Lint translation structure

on:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup mise
        uses: jdx/mise-action@v4.0.1
      - name: Run lint-translation
        working-directory: scripts
        run: go run .
